// Audio Chime & Repeating Waiter-Call Alarm
function playChime(urgent = false) {
  if (!state.soundEnabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = urgent ? "triangle" : "sine";
    if (urgent) {
      osc.frequency.setValueAtTime(987.77, ctx.currentTime);
      osc.frequency.setValueAtTime(1318.51, ctx.currentTime + 0.14);
      osc.frequency.setValueAtTime(987.77, ctx.currentTime + 0.28);
      gain.gain.setValueAtTime(0.14, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.42);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.42);
    } else {
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1174.66, ctx.currentTime + 0.14);
      gain.gain.setValueAtTime(0.09, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.26);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.26);
    }
  } catch (e) {}
}

function updateRepeatingCallAlarm() {
  const activeCalls = state.tables.filter(tb => tb.call);
  const isStaffDevice = (MODE === "tablet" || state.adminAuthed);
  if (activeCalls.length > 0 && isStaffDevice) {
    if (!callAlarmTimer) {
      playChime(true);
      callAlarmTimer = setInterval(() => {
        if (state.tables.some(tb => tb.call)) playChime(true);
      }, 3500);
    }
  } else if (callAlarmTimer) {
    clearInterval(callAlarmTimer);
    callAlarmTimer = null;
  }
}

// Native Browser System Notification + Vibration API
async function enableSystemPush() {
  if (!("Notification" in window)) {
    showToast("此瀏覽器不支援系統推播通知");
    return;
  }
  const perm = await Notification.requestPermission();
  state.pushPermission = perm;
  render();
  if (perm === "granted") {
    showToast("已啟用系統桌面 / 手機背景推播通知！", true);
    sendNativePush("悅膳 SmartDine 即時通知已啟用", "新訂單、出餐進度與顧客呼叫將會即時彈出提醒。");
  } else {
    showToast("通知權限未允許，請於瀏覽器設定開啟");
  }
}


// Native Android & iOS Bridge for OS Status-Bar Push Notifications & Repeating Waiter Alarm
function triggerNativeMobileBridge(title, body, isUrgent) {
  try {
    if (window.AndroidBridge && typeof window.AndroidBridge.notify === "function") {
      window.AndroidBridge.notify(title, body, !!isUrgent);
    }
  } catch (e) {}
  try {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosNotify) {
      window.webkit.messageHandlers.iosNotify.postMessage({ title: title, body: body, urgent: !!isUrgent });
    }
  } catch (e) {}
}

function sendNativePush(title, body) {
  triggerNativeMobileBridge(title, body, title.includes('呼叫'));
  if ("vibrate" in navigator) {
    try { navigator.vibrate([180, 90, 180]); } catch (e) {}
  }
  if ("Notification" in window && Notification.permission === "granted") {
    try {
      const n = new Notification(title, {
        body,
        tag: "smartdine-live-alert",
        renotify: true
      });
      n.onclick = () => {
        window.focus();
        n.close();
      };
    } catch (e) {}
  }
}

function showToast(msg, chime = false, pushTitle = "") {
  state.toastMsg = msg;
  if (chime) playChime(false);
  if (pushTitle) sendNativePush(pushTitle, msg);
  render();
  setTimeout(() => {
    if (state.toastMsg === msg) {
      state.toastMsg = "";
      render();
    }
  }, 3600);
}

function saveLocalCache() {
  localStorage.setItem("smartdine_orders_" + ROOM_CODE, JSON.stringify(state.orders));
  localStorage.setItem("smartdine_menu_" + ROOM_CODE, JSON.stringify(state.menu));
  localStorage.setItem("smartdine_tables_" + ROOM_CODE, JSON.stringify(state.tables));
  localStorage.setItem("smartdine_member", JSON.stringify(state.member));
  localStorage.setItem("smartdine_rev_" + ROOM_CODE, String(lastCloudRev));
}

function applyIncomingPayload(payload, sourceLabel) {
  if (!payload || !payload.rev || payload.rev <= lastCloudRev) return;
  const prevOrderCount = state.orders.length;
  const prevStatusMap = Object.fromEntries(state.orders.map(o => [o.id, o.status]));
  const prevCalls = state.tables.filter(tb => tb.call).map(tb => tb.id);

  lastCloudRev = payload.rev;
  if (Array.isArray(payload.orders)) state.orders = payload.orders;
  if (Array.isArray(payload.menu) && payload.menu.length) state.menu = payload.menu;
  if (Array.isArray(payload.tables) && payload.tables.length) state.tables = payload.tables;
  state.lastSyncTime = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  if (sourceLabel) state.syncStatus = sourceLabel;
  saveLocalCache();
  updateRepeatingCallAlarm();
  render();

  const newCalls = state.tables.filter(tb => tb.call && !prevCalls.includes(tb.id));
  if (newCalls.length > 0) {
    const tList = newCalls.map(x => x.id).join(", ");
    showToast(`顧客服務鈴呼叫：${tList} 桌！`, true, `🔔 SmartDine 呼叫服務員 (${tList})`);
    return;
  }

  if (state.orders.length > prevOrderCount) {
    const newest = state.orders[0];
    showToast(`新訂單 ${newest.id} (${newest.table}) 已送達！`, true, `🍽️ SmartDine 新訂單 (${newest.table})`);
    return;
  }

  const changedOrder = state.orders.find(o => prevStatusMap[o.id] && prevStatusMap[o.id] !== o.status);
  if (changedOrder) {
    const stText = t("statusSteps")[changedOrder.status - 1];
    showToast(`訂單 ${changedOrder.id} 進度更新：${stText}`, true, `📢 SmartDine 出餐進度更新`);
  }
}

// 1. Zero-Config Cross-Device Cloud Live Push (ntfy SSE)
const CLOUD_TOPIC = "smartdine_v3_" + ROOM_CODE.replace(/[^A-Z0-9_-]/gi, "_");

async function pushCloudUpdate() {
  lastCloudRev = Date.now();
  state.lastSyncTime = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  saveLocalCache();
  updateRepeatingCallAlarm();

  if (bc) {
    bc.postMessage({ rev: lastCloudRev, orders: state.orders, menu: state.menu, tables: state.tables });
  }

  if (db) {
    try {
      await db.collection("smartdine_rooms").doc(ROOM_CODE).set({
        rev: lastCloudRev,
        orders: state.orders,
        menu: state.menu,
        tables: state.tables
      });
      state.syncStatus = "FIRESTORE_LIVE";
    } catch (e) {}
  }

  try {
    await fetch("https://ntfy.sh/" + CLOUD_TOPIC, {
      method: "POST",
      headers: { "Title": "SmartDineSync", "Priority": "low" },
      body: JSON.stringify({
        rev: lastCloudRev,
        orders: state.orders,
        menu: state.menu,
        tables: state.tables
      })
    });
    if (!db) state.syncStatus = "CLOUD_SSE";
    render();
  } catch (err) {
    if (!db) state.syncStatus = bc ? "TAB_LIVE" : "LOCAL";
  }
}

function connectZeroConfigCloudSSE() {
  if (sseSource) sseSource.close();
  try {
    sseSource = new EventSource("https://ntfy.sh/" + CLOUD_TOPIC + "/sse?since=10m");
    sseSource.onopen = () => {
      if (!db) state.syncStatus = "CLOUD_SSE";
      render();
    };
    sseSource.onmessage = (ev) => {
      try {
        const wrapper = JSON.parse(ev.data);
        if (wrapper && wrapper.message) {
          const payload = JSON.parse(wrapper.message);
          applyIncomingPayload(payload, db ? "FIRESTORE_LIVE" : "CLOUD_SSE");
        }
      } catch (e) {}
    };
    sseSource.onerror = () => {
      if (!db) state.syncStatus = bc ? "TAB_LIVE" : "LOCAL";
    };
  } catch (e) {}
}

// 2. Optional Private Firebase Firestore Sync
function initFirebaseLive() {
  if (!state.firebaseRaw) return;
  try {
    const cfg = JSON.parse(state.firebaseRaw);
    if (!cfg.apiKey || !cfg.projectId) return;
    if (!firebase.apps.length) firebase.initializeApp(cfg);
    db = firebase.firestore();
    state.syncStatus = "FIRESTORE_LIVE";
    db.collection("smartdine_rooms").doc(ROOM_CODE).onSnapshot(doc => {
      if (doc.exists) {
        applyIncomingPayload(doc.data(), "FIRESTORE_LIVE");
      }
    });
  } catch (err) {
    console.warn("Firebase skipped:", err);
  }
}

});

function t(key) { return I18N[state.lang][key] || key; }
function itemName(item) { return item[state.lang] || item.zh; }

function addToCart(id) {
  const item = state.menu.find(m => m.id === id);
  if (!item) return;
  const found = state.cart.find(c => c.id === id);
  if (found) found.qty += 1;
  else state.cart.push({ ...item, qty: 1, note: "正常口味" });
  render();
}

function updateQty(id, delta) {
  const idx = state.cart.findIndex(c => c.id === id);
  if (idx === -1) return;
  state.cart[idx].qty += delta;
  if (state.cart[idx].qty <= 0) state.cart.splice(idx, 1);
  render();
}

function calcTotals() {
  const subtotal = state.cart.reduce((s, i) => s + i.price * i.qty, 0);
  const service = state.isTakeaway ? 0 : Math.round(subtotal * 0.1);
  const total = Math.max(0, subtotal + service - state.couponDiscount);
  return { subtotal, service, total };
}

function submitOrder() {
  if (!state.cart.length) return;
  const totals = calcTotals();
  const orderId = "ORD-" + String(Date.now()).slice(-5);
  const newOrder = {
    id: orderId,
    table: state.isTakeaway ? "TAKEAWAY" : state.tableNo,
    items: [...state.cart],
    total: totals.total,
    status: 1,
    paid: false,
    createdAt: Date.now(),
    time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
  };

  state.orders.unshift(newOrder);
  if (!state.isTakeaway) {
    const tb = state.tables.find(x => x.id === state.tableNo);
    if (tb) tb.status = "occupied";
  }
  state.cart = [];
  state.tab = "orders";
  pushCloudUpdate();
  render();
  showToast("訂單已即時推送至廚房與 POS！", true);
}

function advanceOrderStatus(orderId) {
  const o = state.orders.find(x => x.id === orderId);
  if (o && o.status < 4) {
    o.status += 1;
    pushCloudUpdate();
    render();
    showToast(`訂單 ${orderId} 已更新為：${t("statusSteps")[o.status - 1]}`, true);
  }
}

function completePayment(orderId) {
  const o = state.orders.find(x => x.id === orderId);
  if (o) {
    o.paid = true;
    o.payMethod = state.selectedPay;
    if (state.member) {
      state.member.points = (state.member.points || 0) + Math.round(o.total);
    }
    pushCloudUpdate();
    render();
    showToast(`電子結賬完成 (${state.selectedPay})！`, true);
  }
}

function callWaiter() {
  const tb = state.tables.find(x => x.id === state.tableNo);
  if (tb) tb.call = true;
  pushCloudUpdate();
  render();
  showToast(`已即時呼叫服務員前往 ${state.tableNo} 桌！`, true);
}

function resolveTableCall(tableId) {
  const tb = state.tables.find(x => x.id === tableId);
  if (tb) tb.call = false;
  pushCloudUpdate();
  render();
  showToast(`已解除 ${tableId} 桌服務呼叫`);
}

function handleAdminLogin(e) {
  e.preventDefault();
  const u = document.getElementById("admUser").value.trim();
  const p = document.getElementById("admPass").value.trim();
  if ((u === "admin" && p === "8888") || (u === "staff" && p === "1234")) {
    state.adminAuthed = true;
    updateRepeatingCallAlarm();
    render();
  } else {

function addNewDish(e) {
  e.preventDefault();
  const zh = document.getElementById("newDishZh").value.trim();
  const en = document.getElementById("newDishEn").value.trim() || zh;
  const cat = document.getElementById("newDishCat").value.trim() || "招牌主食";
  const price = Number(document.getElementById("newDishPrice").value) || 50;
  if (!zh) return;
  state.menu.push({ id: Date.now(), cat, price, img: "🍽️", zh, cn: zh, en, ja: en });
  pushCloudUpdate();
  render();
  showToast("新菜式已即時同步至所有裝置！", true);
}

function deleteDish(id) {
  state.menu = state.menu.filter(m => m.id !== id);
  pushCloudUpdate();
  render();
}

function saveRoomCode(e) {
  e.preventDefault();
  const code = document.getElementById("roomCodeInput").value.trim().toUpperCase();
  if (!code) return;
  localStorage.setItem("smartdine_room", code);
  const u = new URL(window.location.href);
  u.searchParams.set("room", code);
  window.location.href = u.toString();
}

function saveFirebaseConfig(e) {
  e.preventDefault();
  const raw = document.getElementById("fbCfgInput").value.trim();
  state.firebaseRaw = raw;
  localStorage.setItem("smartdine_firebase_cfg", raw);
  initFirebaseLive();
  render();
  showToast("私密 Firestore 設定已套用！");
}

    bodyHtml = `
      <div class="flex-1 flex overflow-hidden">
        <aside class="w-20 bg-slate-900 text-white flex flex-col items-center py-4 gap-4 shrink-0">
          ${[["menu","fa-utensils",t("menu")],["orders","fa-receipt",t("orders")],["member","fa-crown",t("member")],["admin","fa-sliders",t("admin")]].map(([k,ic,lb]) => `
            <button onclick="state.tab='${k}';render()" class="w-16 py-2.5 rounded-2xl flex flex-col items-center gap-1 text-xs ${state.tab===k?'bg-amber-500 text-white font-bold':'text-slate-400'}">
              <i class="fa-solid ${ic} text-base"></i><span>${lb}</span>
            </button>
          `).join("")}
        </aside>
        <main class="flex-1 p-4 overflow-y-auto">
          ${state.tab === "menu" ? renderMenuGrid() : state.tab === "orders" ? renderOrdersView() : state.tab === "member" ? renderMemberView() : renderAdminView()}
        </main>
        <aside class="w-[340px] p-4 border-l bg-slate-100 shrink-0 hidden md:block">
          ${renderCartPanel()}
        </aside>
      </div>
    `;
  } else {
    bodyHtml = `
      <main class="flex-1 p-4 pb-24">
        ${state.tab === "menu" ? `<div class="${MODE==='website'?'grid grid-cols-1 lg:grid-cols-3 gap-5':''}"><div class="${MODE==='website'?'lg:col-span-2':''}">${renderMenuGrid()}</div>${MODE==='website'?`<div>${renderCartPanel()}</div>`:""}</div>` : ""}
        ${state.tab === "cart" ? renderCartPanel() : ""}
        ${state.tab === "orders" ? renderOrdersView() : ""}
        ${state.tab === "member" ? renderMemberView() : ""}
        ${state.tab === "admin" ? renderAdminView() : ""}
      </main>
      <nav class="fixed bottom-0 left-0 right-0 ${MODE==='phone'?'max-w-[480px] mx-auto':''} bg-white border-t grid grid-cols-5 py-2 text-center text-[11px] z-20">
        ${[["menu","fa-utensils",t("menu")],["cart","fa-bag-shopping",t("cart")+`(${state.cart.reduce((s,i)=>s+i.qty,0)})`],["orders","fa-receipt",t("orders")],["member","fa-crown",t("member")],["admin","fa-sliders",t("admin")]].map(([k,ic,lb]) => `
          <button onclick="state.tab='${k}';render()" class="flex flex-col items-center gap-0.5 ${state.tab===k?'text-amber-600 font-bold':'text-slate-400'}">
            <i class="fa-solid ${ic} text-base"></i><span>${lb}</span>
          </button>
        `).join("")}
      </nav>
    `;
  }

  document.getElementById("app").innerHTML = `<div class="${containerClass}">${urgentBannerHtml}${header}${toastHtml}${bodyHtml}</div>`;
}

connectZeroConfigCloudSSE();
initFirebaseLive();
updateRepeatingCallAlarm();
render();
</script>
</body>
</html>
